<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Quotes — photin.eu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-4" style="max-width:960px">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold mb-0">Compare Quotes</h4>
      <small class="text-muted">photin.eu — side-by-side wafer inquiry diff</small>
    </div>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back to Quoting Tool
    </a>
  </div>

  <!-- ── Input panels ──────────────────────────────────────────────────────── -->
  <div class="row g-3 mb-3">

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <span class="fw-semibold"><i class="bi bi-file-text"></i> Quote 1</span>
          <label class="btn btn-sm btn-outline-secondary mb-0">
            <i class="bi bi-upload"></i> Load .txt / .csv
            <input type="file" accept=".txt,.csv" class="d-none"
                   onchange="loadFile(this, 'quote1')">
          </label>
        </div>
        <div class="card-body p-2">
          <textarea id="quote1" class="form-control font-monospace"
                    style="height:200px;font-size:0.72rem;resize:vertical"
                    placeholder="Paste or load first quote text here…"></textarea>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <span class="fw-semibold"><i class="bi bi-file-text"></i> Quote 2</span>
          <label class="btn btn-sm btn-outline-secondary mb-0">
            <i class="bi bi-upload"></i> Load .txt / .csv
            <input type="file" accept=".txt,.csv" class="d-none"
                   onchange="loadFile(this, 'quote2')">
          </label>
        </div>
        <div class="card-body p-2">
          <textarea id="quote2" class="form-control font-monospace"
                    style="height:200px;font-size:0.72rem;resize:vertical"
                    placeholder="Paste or load second quote text here…"></textarea>
        </div>
      </div>
    </div>

  </div>

  <div class="d-flex gap-2 mb-4">
    <button class="btn btn-primary" onclick="compare()">
      <i class="bi bi-intersect"></i> Compare
    </button>
    <button class="btn btn-outline-secondary" onclick="clearAll()">
      <i class="bi bi-x-lg"></i> Clear
    </button>
  </div>

  <!-- ── Result ────────────────────────────────────────────────────────────── -->
  <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="compare.js"></script>
</body>
</html>
